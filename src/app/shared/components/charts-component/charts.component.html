<div class="mat-elevation-z8 chart-wrapper">
	<div class="chart-topbar flex flex-col gap-4 rounded-tl-2xl rounded-tr-2xl border-t border-l border-r border-slate-400/20 bg-white p-6 shadow-[0_12px_28px_rgba(15,23,42,0.08)]">
		<div class="flex flex-col justify-between gap-3 md:flex-row md:items-center">
			<div>
				<h2 class="flex items-center gap-2 text-xl font-semibold">
					<span class="material-symbols-outlined" aria-hidden="true">analytics</span>{{ chartTitle }}
				</h2>
				<p class="text-[0.85rem] text-slate-500">{{ chartSubtitle }}</p>
			</div>
		</div>
	</div>

	<div class="chart-body overflow-hidden rounded-b-2xl border-l border-r border-b border-slate-400/20 bg-white p-4">
		@if (!isBrowser) {
			<p class="text-sm text-slate-500">Chart is available in the browser.</p>
		} @else if (!data || data.length === 0) {
			<p class="text-sm text-slate-500">No data available for chart display.</p>
		} @else {
			@if (chartType === 'merge') {
				<div
					echarts
					[options]="options"
					[initOpts]="initOpts"
					[merge]="updateOptions"
					class="demo-chart"
					style="display:block; height:360px;"
				></div>
			} @else {
				<echarts
					[initOpts]="initOpts"
					[options]="options"
					class="demo-chart"
					style="display:block; height:360px;"
				></echarts>
			}
		}
	</div>
</div>
